openapi: 3.1.0
info:
  title: Client API
  version: '1.0'
  description: Provides access to servers and general account related management endpoints.
  license:
    name: The MIT License (MIT)
    url: 'https://github.com/pterodactyl/panel/blob/develop/LICENSE.md'
  contact:
    name: Dane Everitt
    url: 'https://pterodactyl.io'
    email: dane@pterodactyl.io
  summary: Client API
  x-pterodactyl-panel-version: v1.12.1
  x-pterodactyl-source:
    routes: 'https://github.com/pterodactyl/panel/blob/v1.12.1/routes/api-client.php'
    serializer: 'https://github.com/pterodactyl/panel/blob/v1.12.1/app/Extensions/League/Fractal/Serializers/PterodactylSerializer.php'
servers:
  - url: 'https://pterodactyl.test/api/client'
    description: Client API
paths:
  /:
    x-pterodactyl-source:
      controller: 'https://github.com/pterodactyl/panel/blob/v1.12.1/app/Http/Controllers/Api/Client/ClientController.php'
    get:
      summary: Get Servers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  object:
                    type: string
                    enum:
                      - list
                  data:
                    type: array
                    uniqueItems: true
                    items:
                      type: object
                      properties:
                        object:
                          type: string
                        attributes:
                          $ref: '#/components/schemas/server'
                  meta:
                    type: object
                    properties:
                      pagination:
                        $ref: '#/components/schemas/pagination'
              examples:
                Example:
                  value:
                    object: list
                    data:
                      - object: server
                        attributes:
                          server_owner: true
                          identifier: 2bc172e4
                          internal_id: 1
                          uuid: 2bc172e4-6a09-4dc2-b832-2c859593290f
                          name: Java 8
                          node: Wings
                          sftp_details:
                            ip: 127.0.0.1
                            port: 2022
                          description: ''
                          limits:
                            memory: 1024
                            swap: 0
                            disk: 1024
                            io: 500
                            cpu: 0
                            threads: null
                            oom_disabled: true
                          invocation: java -Xms128M -Xmx1024M -Dterminal.jline=false -Dterminal.ansi=true -jar server.jar
                          docker_image: 'ghcr.io/pterodactyl/yolks:java_8'
                          egg_features:
                            - eula
                            - java_version
                            - pid_limit
                          feature_limits:
                            databases: 0
                            allocations: 0
                            backups: 0
                          status: null
                          is_suspended: false
                          is_installing: false
                          is_transferring: false
                          relationships:
                            allocations:
                              object: list
                              data:
                                - object: allocation
                                  attributes:
                                    id: 41
                                    ip: 0.0.0.0
                                    ip_alias: null
                                    port: 1234
                                    notes: null
                                    is_default: true
                            variables:
                              object: list
                              data:
                                - object: egg_variable
                                  attributes:
                                    name: Minecraft Version
                                    description: "The version of minecraft to download. \r\n\r\nLeave at latest to always get the latest version. Invalid versions will default to latest."
                                    env_variable: MINECRAFT_VERSION
                                    default_value: latest
                                    server_value: 1.8.8
                                    is_editable: true
                                    rules: 'nullable|string|max:20'
                                - object: egg_variable
                                  attributes:
                                    name: Server Jar File
                                    description: The name of the server jarfile to run the server with.
                                    env_variable: SERVER_JARFILE
                                    default_value: server.jar
                                    server_value: server.jar
                                    is_editable: true
                                    rules: 'required|regex:/^([\w\d._-]+)(\.jar)$/'
                                - object: egg_variable
                                  attributes:
                                    name: Build Number
                                    description: "The build number for the paper release.\r\n\r\nLeave at latest to always get the latest version. Invalid versions will default to latest."
                                    env_variable: BUILD_NUMBER
                                    default_value: latest
                                    server_value: latest
                                    is_editable: true
                                    rules: 'required|string|max:20'
                    meta:
                      pagination:
                        total: 1
                        count: 1
                        per_page: 50
                        current_page: 1
                        total_pages: 1
                        links: {}
        '400':
          $ref: '#/components/responses/400'
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
      operationId: get-servers
      description: Returns a list of all servers the owner of the API key has access to.
      parameters:
        - schema:
            type: string
            enum:
              - admin
              - owner
              - admin-all
          in: query
          name: type
          description: Determines which servers to return. If not specified all servers you have access to as an owner or subuser are returned.
          style: form
        - name: include
          in: query
          required: false
          schema:
            type: string
            enum:
              - egg
              - subusers
          description: 'Comma-delimited list of relationships to include. Allowed: `egg`, `subusers`.'
          style: form
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/per_page'
        - schema:
            type: string
            uniqueItems: true
            example: 'filter[*]=playthrough'
          in: query
          name: 'filter[*]'
          style: form
          description: Allows filtering of the results before they are returned.
        - schema:
            type: string
            uniqueItems: true
            example: 'filter[name]=minecraft'
          in: query
          name: 'filter[name]'
          style: form
          description: Allows filtering of the results before they are returned.
        - schema:
            type: string
            uniqueItems: true
            example: 'filter[uuid]=4d3e1401'
          in: query
          name: 'filter[uuid]'
          style: form
          description: Allows filtering of the results before they are returned.
    parameters: []
  /permissions:
    x-pterodactyl-source:
      controller: 'https://github.com/pterodactyl/panel/blob/v1.12.1/app/Http/Controllers/Api/Client/ClientController.php'
    get:
      summary: List Permissions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                  attributes:
                    type: object
                    properties:
                      permissions:
                        type: object
                        properties:
                          websocket:
                            type: object
                            properties:
                              description:
                                type: string
                              keys:
                                type: object
                                properties:
                                  connect:
                                    type: string
                          control:
                            type: object
                            properties:
                              description:
                                type: string
                              keys:
                                type: object
                                properties:
                                  console:
                                    type: string
                                  start:
                                    type: string
                                  stop:
                                    type: string
                                  restart:
                                    type: string
                          user:
                            type: object
                            properties:
                              description:
                                type: string
                              keys:
                                type: object
                                properties:
                                  create:
                                    type: string
                                  read:
                                    type: string
                                  update:
                                    type: string
                                  delete:
                                    type: string
                          file:
                            type: object
                            properties:
                              description:
                                type: string
                              keys:
                                type: object
                                properties:
                                  create:
                                    type: string
                                  read:
                                    type: string
                                  read-content:
                                    type: string
                                  update:
                                    type: string
                                  delete:
                                    type: string
                                  archive:
                                    type: string
                                  sftp:
                                    type: string
                          backup:
                            type: object
                            properties:
                              description:
                                type: string
                              keys:
                                type: object
                                properties:
                                  create:
                                    type: string
                                  read:
                                    type: string
                                  delete:
                                    type: string
                                  download:
                                    type: string
                                  restore:
                                    type: string
                          allocation:
                            type: object
                            properties:
                              description:
                                type: string
                              keys:
                                type: object
                                properties:
                                  read:
                                    type: string
                                  create:
                                    type: string
                                  update:
                                    type: string
                                  delete:
                                    type: string
                          startup:
                            type: object
                            properties:
                              description:
                                type: string
                              keys:
                                type: object
                                properties:
                                  read:
                                    type: string
                                  update:
                                    type: string
                                  docker-image:
                                    type: string
                          database:
                            type: object
                            properties:
                              description:
                                type: string
                              keys:
                                type: object
                                properties:
                                  create:
                                    type: string
                                  read:
                                    type: string
                                  update:
                                    type: string
                                  delete:
                                    type: string
                                  view_password:
                                    type: string
                          schedule:
                            type: object
                            properties:
                              description:
                                type: string
                              keys:
                                type: object
                                properties:
                                  create:
                                    type: string
                                  read:
                                    type: string
                                  update:
                                    type: string
                                  delete:
                                    type: string
                          settings:
                            type: object
                            properties:
                              description:
                                type: string
                              keys:
                                type: object
                                properties:
                                  rename:
                                    type: string
                                  reinstall:
                                    type: string
                          activity:
                            type: object
                            properties:
                              description:
                                type: string
                              keys:
                                type: object
                                properties:
                                  read:
                                    type: string
              examples:
                example:
                  value:
                    object: system_permissions
                    attributes:
                      permissions:
                        websocket:
                          description: 'Allows the user to connect to the server websocket, giving them access to view console output and realtime server stats.'
                          keys:
                            connect: Allows a user to connect to the websocket instance for a server to stream the console.
                        control:
                          description: 'Permissions that control a user''s ability to control the power state of a server, or send commands.'
                          keys:
                            console: Allows a user to send commands to the server instance via the console.
                            start: Allows a user to start the server if it is stopped.
                            stop: Allows a user to stop a server if it is running.
                            restart: 'Allows a user to perform a server restart. This allows them to start the server if it is offline, but not put the server in a completely stopped state.'
                        user:
                          description: 'Permissions that allow a user to manage other subusers on a server. They will never be able to edit their own account, or assign permissions they do not have themselves.'
                          keys:
                            create: Allows a user to create new subusers for the server.
                            read: Allows the user to view subusers and their permissions for the server.
                            update: Allows a user to modify other subusers.
                            delete: Allows a user to delete a subuser from the server.
                        file:
                          description: Permissions that control a user's ability to modify the filesystem for this server.
                          keys:
                            create: Allows a user to create additional files and folders via the Panel or direct upload.
                            read: 'Allows a user to view the contents of a directory, but not view the contents of or download files.'
                            read-content: Allows a user to view the contents of a given file. This will also allow the user to download files.
                            update: Allows a user to update the contents of an existing file or directory.
                            delete: Allows a user to delete files or directories.
                            archive: Allows a user to archive the contents of a directory as well as decompress existing archives on the system.
                            sftp: Allows a user to connect to SFTP and manage server files using the other assigned file permissions.
                        backup:
                          description: Permissions that control a user's ability to generate and manage server backups.
                          keys:
                            create: Allows a user to create new backups for this server.
                            read: Allows a user to view all backups that exist for this server.
                            delete: Allows a user to remove backups from the system.
                            download: 'Allows a user to download a backup for the server. Danger: this allows a user to access all files for the server in the backup.'
                            restore: 'Allows a user to restore a backup for the server. Danger: this allows the user to delete all of the server files in the process.'
                        allocation:
                          description: Permissions that control a user's ability to modify the port allocations for this server.
                          keys:
                            read: Allows a user to view all allocations currently assigned to this server. Users with any level of access to this server can always view the primary allocation.
                            create: Allows a user to assign additional allocations to the server.
                            update: Allows a user to change the primary server allocation and attach notes to each allocation.
                            delete: Allows a user to delete an allocation from the server.
                        startup:
                          description: Permissions that control a user's ability to view this server's startup parameters.
                          keys:
                            read: Allows a user to view the startup variables for a server.
                            update: Allows a user to modify the startup variables for the server.
                            docker-image: Allows a user to modify the Docker image used when running the server.
                        database:
                          description: Permissions that control a user's access to the database management for this server.
                          keys:
                            create: Allows a user to create a new database for this server.
                            read: Allows a user to view the database associated with this server.
                            update: Allows a user to rotate the password on a database instance. If the user does not have the view_password permission they will not see the updated password.
                            delete: Allows a user to remove a database instance from this server.
                            view_password: Allows a user to view the password associated with a database instance for this server.
                        schedule:
                          description: Permissions that control a user's access to the schedule management for this server.
                          keys:
                            create: Allows a user to create new schedules for this server.
                            read: Allows a user to view schedules and the tasks associated with them for this server.
                            update: Allows a user to update schedules and schedule tasks for this server.
                            delete: Allows a user to delete schedules for this server.
                        settings:
                          description: Permissions that control a user's access to the settings for this server.
                          keys:
                            rename: Allows a user to rename this server.
                            reinstall: Allows a user to trigger a reinstall of this server.
                        activity:
                          description: Permissions that control a user's access to the server activity logs.
                          keys:
                            read: Allows a user to view the activity logs for the server.
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
      operationId: get-permissions
      description: Returns all of the permissions on the Panel instance.
      x-internal: false
  /account:
    x-pterodactyl-source:
      controller: 'https://github.com/pterodactyl/panel/blob/v1.12.1/app/Http/Controllers/Api/Client/AccountController.php'
    get:
      summary: Get Account Details
      operationId: get-account
      description: Retrieves information about the account the API key is associated with.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  object:
                    type: string
                  attributes:
                    type: object
                    properties:
                      id:
                        type: number
                      admin:
                        type: boolean
                      username:
                        type: string
                      email:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      language:
                        type: string
                    required:
                      - id
                      - admin
                      - username
                      - email
                      - first_name
                      - last_name
                      - language
                required:
                  - object
                  - attributes
              examples:
                example:
                  value:
                    object: user
                    attributes:
                      id: 1
                      admin: true
                      username: Pterodactyl
                      email: Pterodactyl@pterodactyl.io
                      first_name: Perry
                      last_name: Dactyl
                      language: en
        '401':
          $ref: '#/components/responses/401'
        '403':
          $ref: '#/components/responses/403'
        '405':
          $ref: '#/components/responses/405'
      tags:
        - Account
  /account/two-factor:
    x-pterodactyl-source:
      controller: 'https://github.com/pterodactyl/panel/blob/v1.12.1/app/Http/Controllers/Api/Client/TwoFactorController.php'
    get:
      summary: Setup 2FA
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      image_url_data:
                        type: string
                      secret:
                        type: string
              examples:
                example:
                  value:
                    data:
                      image_url_data: 'otpauth://totp/Pterodactyl:Pterodactyl%40pterodactyl.io?secret=XSDXOMGVUSBX3NP63ITOXJGCIGYFN123&issuer=Pterodactyl'
                      secret: XSDXOMGVUSBX3NP63ITOXJGCIGYFN123
      operationId: get-account-two-factor
      description: 'Generates a new secret code and associated TOTP data. This can then be used to generate a QR code for the user to scan with their device. Subsequent requests to this endpoint will trigger the secret to be rotated, thus invalidating previous tokens.'
      tags:
        - Account
    post:
      summary: Enable 2FA
      operationId: post-account-two-factor
      responses:
        '200':
          description: The response body will contain an array of recovery codes that the user can use if they lose their device.
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  object:
                    type: string
                  attributes:
                    type: object
                    properties:
                      tokens:
                        type: array
                        items:
                          type: string
              examples:
                example:
                  value:
                    object: string
                    attributes:
                      tokens:
                        - R10h0FaLEK
                        - A9JK6TUNuo
                        - L8LPYf31bp
                        - P746oBtio6
                        - v6KHiL1WAu
                        - t5vpwR5HiU
                        - 64HwEIsBCb
                        - p3LHWycn8r
                        - e2LPKB37ss
                        - d1UmNeHetb
      description: Enable 2FA on an account using the code generated by the `GET` version of this endpoint.
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                code:
                  type: string
                password:
                  type: string
              required:
                - code
                - password
            examples:
              example:
                value:
                  code: '505134'
                  password: my password
        description: The request body must include only the 6-digit code generated by the user's 2FA application. It must also include the user's current password.
      tags:
        - Account
  /account/two-factor/disable:
    x-pterodactyl-source:
      controller: 'https://github.com/pterodactyl/panel/blob/v1.12.1/app/Http/Controllers/Api/Client/TwoFactorController.php'
    post:
      summary: Disable 2FA
      operationId: post-account-two-factor-disable
      responses:
        '204':
          description: No Content
      description: Disables 2FA on a user's account if it has already been enabled.
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                password:
                  type: string
              required:
                - password
            examples:
              example:
                value:
                  password: MySuperAwesomePassword!123
        description: ''
      tags:
        - Account
  /account/email:
    x-pterodactyl-source:
      controller: 'https://github.com/pterodactyl/panel/blob/v1.12.1/app/Http/Controllers/Api/Client/AccountController.php'
    put:
      summary: Change Email
      operationId: put-email
      responses:
        '204':
          description: No Content
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                email:
                  type: string
                  description: The new email address to use for this account.
                password:
                  type: string
                  description: The current account password.
              required:
                - email
                - password
            examples:
              example:
                value:
                  email: perry@pterodactyl.io
                  password: MySuperAwesomePassword!123
      description: Updates the email address for the current account.
      tags:
        - Account
    parameters: []
  /account/password:
    x-pterodactyl-source:
      controller: 'https://github.com/pterodactyl/panel/blob/v1.12.1/app/Http/Controllers/Api/Client/AccountController.php'
    put:
      summary: Change Password
      operationId: put-password
      responses:
        '204':
          description: No Content
      description: Updates the password for the current account and signs out all other active sessions.
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                current_password:
                  type: string
                password:
                  type: string
                password_confirmation:
                  type: string
              required:
                - current_password
                - password
                - password_confirmation
            examples:
              example:
                value:
                  current_password: MySuperAwesomePassword!123
                  password: MyNEWSuperAwesomePassword!1234
                  password_confirmation: MyNEWSuperAwesomePassword!1234
      tags:
        - Account
    parameters: []
  /account/api-keys:
    x-pterodactyl-source:
      controller: 'https://github.com/pterodactyl/panel/blob/v1.12.1/app/Http/Controllers/Api/Client/ApiKeyController.php'
    get:
      summary: Get API Keys
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                description: ''
                type: object
                properties:
                  object:
                    type: string
                    enum:
                      - list
                  data:
                    type: array
                    uniqueItems: true
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        object:
                          type: string
                          enum:
                            - api_key
                        attributes:
                          $ref: '#/components/schemas/api-key'
              examples:
                example:
                  value:
                    object: list
                    data:
                      - object: api_key
                        attributes:
                          identifier: DkXVQLiLMVb1V7lA
                          description: API Test
                          allowed_ips: []
                          last_used_at: null
                          created_at: '2022-02-13T17:58:48-05:00'
                      - object: api_key
                        attributes:
                          identifier: ITZK7NWMhjPImCWG
                          description: Test API key with Allowed IPS
                          allowed_ips:
                            - 127.0.0.1
                            - 192.168.1.5
                            - 45.36.21.65
                          last_used_at: '2022-03-01T01:41:51-05:00'
                          created_at: '2022-03-12T15:22:23-05:00'
      operationId: get-account-api-keys
      description: Returns a list of all active API keys for an account.
      tags:
        - Account
    parameters: []
    post:
      summary: Create API Key
      operationId: post-account-api-keys
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum:
                      - api_key
                  attributes:
                    $ref: '#/components/schemas/api-key'
                  meta:
                    type: object
                    properties:
                      secret_token:
                        type: string
                        description: The secret part of the API key. This should be concatenated with the `identifer` returned in the `attributes` object.
              examples:
                example-1:
                  value: {}
      description: Creates a new API key for an account.
      requestBody:
        content:
          application/json:
            schema:
              description: ''
              type: object
              properties:
                description:
                  type: string
                  description: |
                    A short description of the API key.
                  maxLength: 500
                  minLength: 0
                allowed_ips:
                  type: array
                  maxItems: 50
                  minItems: 0
                  uniqueItems: true
                  description: The `allowed_ips` field can include up to 50 IP addresses that are allowed to make use of the generated API key. IPs can be written in CIDR notation to support larger ranges.
                  items:
                    type: string
                    example: 192.168.1.100/29
            examples:
              example:
                value:
                  description: Restricted IPs
                  allowed_ips:
                    - 127.0.0.1
                    - 192.168.50.1
        description: ''
      tags:
        - Account
  '/account/api-keys/{identifier}':
    x-pterodactyl-source:
      controller: 'https://github.com/pterodactyl/panel/blob/v1.12.1/app/Http/Controllers/Api/Client/ApiKeyController.php'
    parameters:
      - $ref: '#/components/parameters/api-key'
    delete:
      summary: Delete API Key
      operationId: delete-account-api-keys-identifier
      responses:
        '204':
          description: No Content
      description: Deletes an API key.
      tags:
        - Account
  /account/ssh-keys:
    x-pterodactyl-source:
      controller: 'https://github.com/pterodactyl/panel/blob/v1.12.1/app/Http/Controllers/Api/Client/SSHKeyController.php'
    get:
      summary: Get SSH Keys
      operationId: get-account-ssh-keys
      description: Returns a list of your ssh keys.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
