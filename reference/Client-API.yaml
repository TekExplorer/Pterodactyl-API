  responses:
    '400':
      description: 'A `400: Bad Request` error response is generally returned when the request you''re making cannot be processed, and is not due to an internal server error or validation issue. This error almost always will include additional details about why the operation could not be completed.'
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  type: object
                  properties:
                    code:
                      type: string
                    status:
                      type: string
                    detail:
                      type: string
          examples:
            Invalid Filter Type:
              value:
                errors:
                  - code: InvalidFilterQuery
                    status: '400'
                    detail: 'Requested filter(s) `0` are not allowed. Allowed filter(s) are `uuid, name, external_id, *`.'
    '401':
      description: 'A `401: Unauthorized` error response is only returned when you fail to include proper authorization headers in your API request. This almost always means you are missing the `Authorization: Bearer abcd1234` header in your request, or it is being stripped out by a proxy layer.'
      content:
        application/json:
          schema:
            description: ''
            type: object
            properties:
              errors:
                type: array
                uniqueItems: true
                minItems: 1
                items:
                  type: object
                  properties:
                    code:
                      type: string
                    status:
                      type: string
                      pattern: '^[0-9]+'
                      minLength: 3
                      maxLength: 3
                      default: '401'
                      enum:
                        - '401'
                      example: '401'
                    detail:
                      type: string
                  required:
                    - code
                    - status
                    - detail
            required:
              - errors
          examples:
            No Header Provided:
              value:
                errors:
                  - code: HttpException
                    status: '401'
                    detail: A bearer token or valid user session cookie must be provided to access this endpoint.
      headers: {}
    '403':
      description: 'A `403: Forbidden` error response indicates that you lack permission to perform the given action. This is almost always due to providing an API key that does not have permission to access the resource you''ve requested, or the API key is scoped to other resources.'
      content:
        application/json:
          schema:
            description: ''
            type: object
            properties:
              errors:
                type: array
                uniqueItems: true
                items:
                  type: object
                  properties:
                    code:
                      type: string
                    status:
                      type: string
                      pattern: '^[0-9]+'
                      minLength: 3
                      maxLength: 3
                      enum:
                        - '403'
                      default: '403'
                    detail:
                      type: string
                  required:
                    - code
                    - status
                    - detail
            required:
              - errors
          examples:
            Unauthorized:
              value:
                errors:
                  - code: AccessDeniedHttpException
                    status: '403'
                    detail: This action is unauthorized.
    '405':
      description: 'A `405: Method Not Allowed` error response is returned if you make a request to an endpoint that exists, but does not support the given HTTP verb. For example, making a `POST` request to an endpoint that only accepts a `PUT`, or a `GET` request to a `POST` endpoint.'
      content:
        application/json:
          schema:
            description: ''
            type: object
            properties:
              errors:
                type: array
                uniqueItems: true
                items:
                  $ref: '#/components/schemas/error'
            required:
              - errors
          examples:
            Method Not Allowed:
              value:
                errors:
                  - code: MethodNotAllowedHttpException
                    status: '405'
                    detail: Method is not supported for this route.
    '419':
      description: 'A `419: CSRF Token Mismatch` error response is only returned when you are making improper requests to the API. This should _never_ be returned if you are only including the necessary headers for API authentication.'
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/error'
          examples:
            Mismatch:
              value:
                errors:
                  - code: HttpException
                    status: '419'
                    detail: CSRF token mismatch.
    '422':
      description: 'A `422: Unprocessable Entity` error response is returned when the data provided to the endpoint failed to pass validation controls. This error response will always include the specific fields that are impacted, and will indicate what changes are necessary to complete the request successfully.'
      content:
        application/json:
          schema:
            type: object
            properties:
              errors:
                type: array
                items:
                  $ref: '#/components/schemas/error'
          examples:
            Validation Error:
              value:
                errors:
                  - code: ValidationException
                    status: '422'
                    detail: The description field is required.
                    meta:
                      source_field: description
                      rule: required
