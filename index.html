<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Pterodactyl Client API</title>
    <!-- Embed elements Elements via Web Component -->
    <script src="https://unpkg.com/@stoplight/elements/web-components.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@stoplight/elements/styles.min.css">
    <style>
      #branch-selector {
        position: fixed;
        top: 10px;
        right: 10px;
        z-index: 9999;
        background: white;
        padding: 6px 10px;
        border-radius: 4px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        font-family: sans-serif;
        font-size: 14px;
      }
      #branch-selector label {
        margin-right: 6px;
      }
    </style>
  </head>
  <body>

    <div id="branch-selector">
      <label for="branch-select">Branch:</label>
      <select id="branch-select"></select>
    </div>

    <elements-api
      id="elements-api"
      router="hash"
      layout="responsive"
      hideTryIt="false"
    />

    <script>
      const REPO = 'TekExplorer/Pterodactyl-API';
      const API_BASE = 'https://api.github.com/repos/' + REPO + '/branches';
      const RAW_BASE = 'https://raw.githubusercontent.com/' + REPO + '/';
      const YAML_PATH = '/reference/Client-API.yaml';
      const DEFAULT_BRANCH = 'master';

      const select = document.getElementById('branch-select');
      const elementsApi = document.getElementById('elements-api');

      function setApiUrl(branch) {
        elementsApi.setAttribute('apiDescriptionUrl', RAW_BASE + branch + YAML_PATH);
      }

      fetch(API_BASE)
        .then(function(res) {
          if (!res.ok) throw new Error('GitHub API returned ' + res.status);
          return res.json();
        })
        .then(function(branches) {
          branches.forEach(function(b) {
            const opt = document.createElement('option');
            opt.value = b.name;
            opt.textContent = b.name;
            if (b.name === DEFAULT_BRANCH) opt.selected = true;
            select.appendChild(opt);
          });
          const initial = select.value || DEFAULT_BRANCH;
          setApiUrl(initial);
        })
        .catch(function() {
          // Fallback to default branch if API is unavailable
          const opt = document.createElement('option');
          opt.value = DEFAULT_BRANCH;
          opt.textContent = DEFAULT_BRANCH;
          select.appendChild(opt);
          setApiUrl(DEFAULT_BRANCH);
        });

      select.addEventListener('change', function() {
        setApiUrl(select.value);
      });
    </script>

  </body>
</html>
